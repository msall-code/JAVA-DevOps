# CONFIGURATION LOCAL (IDE)
spring.application.name=notification-service
spring.profiles.active=local
server.port=8083

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

# Deserialization avec gestion d'erreurs
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.microservices.common.event

# Logs DEBUG pour voir les messages arriver
logging.level.com.microservices=DEBUG
product.service.url=http://localhost:8081