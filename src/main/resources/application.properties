spring.application.name=achat-en-ligne-ms
# ========== SERVER ==========
server.port=8080

# ========== POSTGRESQL ==========
spring.datasource.url=jdbc:postgresql://localhost:5432/achat_en_ligne_db
spring.datasource.username=postgres
spring.datasource.password=MonNouveauMotDePasse123
spring.datasource.driver-class-name=org.postgresql.Driver

# ========== JPA / HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========== H2 (désactivé) ==========
spring.h2.console.enabled=false

# ========== CACHE ==========
spring.cache.type=caffeine

# ========== LOGS ==========
logging.level.com.groupeisi.company=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ========== JWT ==========
app.jwt.secret=groupeisi_secret_key_achat_en_ligne_2024_super_secure_256_bits_minimum_ok
app.jwt.expiration=86400000

# ========== SWAGGER ==========
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m
