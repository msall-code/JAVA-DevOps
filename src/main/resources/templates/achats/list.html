<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Achats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/produits}">
            <i class="bi bi-shop me-2"></i>Achat en Ligne
        </a>
        <div class="navbar-nav ms-auto flex-row align-items-center gap-3">
            <a class="nav-link text-white" th:href="@{/produits}">
                <i class="bi bi-box-seam me-1"></i>Produits
            </a>
            <a class="nav-link text-white active" th:href="@{/achats}">
                <i class="bi bi-cart me-1"></i>Achats
            </a>
            <a class="nav-link text-white" th:href="@{/ventes}">
                <i class="bi bi-tag me-1"></i>Ventes
            </a>
            <span class="text-white-50 small">
                <i class="bi bi-person-circle me-1"></i>
                <span th:text="${userEmail}"></span>
            </span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout-web}">
                <i class="bi bi-box-arrow-right"></i>
            </a>
        </div>
    </div>
</nav>

<div class="container my-4">

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">
            <i class="bi bi-cart me-2 text-primary"></i>
            Gestion des Achats
        </h4>
        <a th:href="@{/achats/nouveau}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Nouvel achat
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-primary">
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Produit</th>
                    <th>Quantité</th>
                    <th>Acheteur</th>
                    <th>Statut</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(achats)}">
                    <td colspan="7"
                        class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                        Aucun achat enregistré
                    </td>
                </tr>
                <tr th:each="a : ${achats}">
                    <td th:text="${a.id}"></td>
                    <td>
                        <small th:text="${#dates.format(a.dateP,
                                'dd/MM/yyyy HH:mm')}">
                        </small>
                    </td>
                    <td>
                            <span class="badge bg-secondary"
                                  th:text="${a.productRef}">
                            </span>
                        <small class="ms-1"
                               th:text="${a.productName}">
                        </small>
                    </td>
                    <td th:text="${a.quantity}"></td>
                    <td>
                        <small class="text-muted"
                               th:text="${a.userEmail}">
                        </small>
                    </td>
                    <td>
                            <span th:if="${a.venteValidee}"
                                  class="badge bg-success">
                                <i class="bi bi-check-circle me-1"></i>
                                Vendu
                            </span>
                        <span th:unless="${a.venteValidee}"
                              class="badge bg-warning text-dark">
                                <i class="bi bi-hourglass me-1"></i>
                                En attente
                            </span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/achats/delete/{id}(id=${a.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Supprimer cet achat ?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
