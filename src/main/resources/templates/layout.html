<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} ?: 'Achat en Ligne — Groupe ISI'">Achat en Ligne</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/produits}">
            <i class="bi bi-shop me-2"></i>Achat en Ligne
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/produits}"
                       th:classappend="${#httpServletRequest.requestURI.contains('/produits')} ? 'active' : ''">
                        <i class="bi bi-box-seam me-1"></i>Produits
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/achats}"
                       th:classappend="${#httpServletRequest.requestURI.contains('/achats')} ? 'active' : ''">
                        <i class="bi bi-cart me-1"></i>Achats
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ventes}"
                       th:classappend="${#httpServletRequest.requestURI.contains('/ventes')} ? 'active' : ''">
                        <i class="bi bi-tag me-1"></i>Ventes
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item me-2">
                    <span class="text-white-50 small">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${session.userEmail}">utilisateur</span>
                    </span>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/logout-web}">
                        <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENU -->
<main class="container my-4">
    <!-- Messages flash -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- PAGE CONTENT -->
    <th:block th:fragment="content"></th:block>
</main>

<!-- FOOTER -->
<footer class="footer mt-auto py-3 bg-light border-top">
    <div class="container text-center text-muted small">
        <span>Groupe ISI &copy; 2024 — Microservice Achat en Ligne</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
