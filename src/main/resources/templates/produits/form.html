<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/produits}"><i class="bi bi-shop me-2"></i>Achat en Ligne</a>
    </div>
</nav>

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-semibold">
                    <i class="bi bi-box-seam me-2"></i>
                    <span th:text="${produit.ref != null} ? 'Modifier le produit' : 'Nouveau produit'"></span>
                </div>
                <div class="card-body p-4">
                    <form th:action="${produit.ref != null} ? @{/produits/update/{ref}(ref=${produit.ref})} : @{/produits/save}"
                          th:object="${produit}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Référence</label>
                            <input type="text" th:field="*{ref}" class="form-control"
                                   placeholder="PROD-001"
                                   th:readonly="${produit.ref != null}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nom du produit</label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   placeholder="Ex: Ordinateur portable" required/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Stock</label>
                            <input type="number" th:field="*{stock}" class="form-control"
                                   step="0.01" min="0" placeholder="0" required/>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-check-lg me-1"></i>Enregistrer
                            </button>
                            <a th:href="@{/produits}" class="btn btn-outline-secondary flex-fill">
                                <i class="bi bi-x-lg me-1"></i>Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
