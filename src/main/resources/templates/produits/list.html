<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Produits</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/produits}">
            <i class="bi bi-shop me-2"></i>Achat en Ligne
        </a>
        <div class="navbar-nav ms-auto flex-row align-items-center gap-3">
            <a class="nav-link text-white active" th:href="@{/produits}">
                <i class="bi bi-box-seam me-1"></i>Produits
            </a>
            <a class="nav-link text-white" th:href="@{/achats}">
                <i class="bi bi-cart me-1"></i>Achats
            </a>
            <a class="nav-link text-white" th:href="@{/ventes}">
                <i class="bi bi-tag me-1"></i>Ventes
            </a>
            <span class="text-white-50 small">
                <i class="bi bi-person-circle me-1"></i>
                <span th:text="${userEmail}"></span>
            </span>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout-web}">
                <i class="bi bi-box-arrow-right"></i>
            </a>
        </div>
    </div>
</nav>

<div class="container my-4">

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">
            <i class="bi bi-box-seam me-2 text-primary"></i>
            Gestion des Produits
        </h4>
        <a th:href="@{/produits/nouveau}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Nouveau produit
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-primary">
                <tr>
                    <th>Référence</th>
                    <th>Nom</th>
                    <th>Stock</th>
                    <th>Propriétaire</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(produits)}">
                    <td colspan="5"
                        class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-4 d-block mb-2"></i>
                        Aucun produit enregistré
                    </td>
                </tr>
                <tr th:each="p : ${produits}">
                    <td>
                            <span class="badge bg-secondary"
                                  th:text="${p.ref}">
                            </span>
                    </td>
                    <td th:text="${p.name}"></td>
                    <td>
                            <span th:classappend="${p.stock <= 5} ?
                                'badge bg-danger' : 'badge bg-success'"
                                  th:text="${p.stock}">
                            </span>
                    </td>
                    <td>
                        <small class="text-muted"
                               th:text="${p.userEmail}">
                        </small>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/produits/edit/{ref}(ref=${p.ref})}"
                           class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a th:href="@{/produits/delete/{ref}(ref=${p.ref})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Supprimer ce produit ?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
