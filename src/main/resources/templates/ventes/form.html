<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nouvelle vente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/produits}"><i class="bi bi-shop me-2"></i>Achat en Ligne</a>
    </div>
</nav>

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-semibold">
                    <i class="bi bi-tag me-2"></i>Nouvelle vente
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/ventes/save}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Produit</label>
                            <select name="productRef" class="form-select" required>
                                <option value="">-- Sélectionner un produit --</option>
                                <option th:each="p : ${produits}"
                                        th:value="${p.ref}"
                                        th:text="${p.name + ' (stock: ' + p.stock + ')'}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Quantité</label>
                            <input type="number" name="quantity" class="form-control"
                                   step="0.01" min="1" placeholder="1" required/>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-check-lg me-1"></i>Valider la vente
                            </button>
                            <a th:href="@{/ventes}" class="btn btn-outline-secondary flex-fill">
                                <i class="bi bi-x-lg me-1"></i>Annuler
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
